<script src="products.js"></script>
<script src="script.js"></script>
<script>
(function() {
  const canvas = document.getElementById("smoke-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;
  window.addEventListener("resize", () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });
  const particles = [];
  const COUNT = 80;
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function createParticle() {
    return { x: rand(0, W), y: H + rand(0, 100), r: rand(80, 200), alpha: rand(0.4, 0.75), vx: rand(-0.6, 0.6), vy: rand(-0.5, -1.2), grow: rand(0.3, 0.8), fade: rand(0.001, 0.003) };
  }
  for (let i = 0; i < COUNT; i++) { const p = createParticle(); p.y = rand(0, H); particles.push(p); }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach((p, i) => {
      ctx.beginPath();
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      grad.addColorStop(0, `rgba(70,55,190,${p.alpha})`);
      grad.addColorStop(0.4, `rgba(50,40,150,${p.alpha * 0.6})`);
      grad.addColorStop(0.75, `rgba(30,25,100,${p.alpha * 0.25})`);
      grad.addColorStop(1, `rgba(20,15,80,0)`);
      ctx.fillStyle = grad;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      p.x += p.vx; p.y += p.vy; p.r += p.grow; p.alpha -= p.fade;
      if (p.alpha <= 0 || p.y + p.r < 0) particles[i] = createParticle();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
