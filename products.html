<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produits - Onchiche225</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
<div class="header-top">
<h1 class="logo">
<a href="index.html" class="logo-link"><img src="logo.png" alt="Logo Onchiche225" class="site-logo" width="320" height="74" decoding="async" onerror="this.onerror=null;this.src='logo.svg';"></a>
</h1>
<button type="button" class="nav-toggle" data-i18n-aria-label="open_menu" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="main-nav">☰</button>
</div>
<nav id="main-nav" class="main-nav">
<a href="index.html" data-i18n="nav_home">Accueil</a>
<a href="products.html" data-i18n="nav_products">Produits</a>
<a href="cart.html"><span data-i18n="nav_cart">Panier</span> 🛒 (<span id="cart-count">0</span>)</a>
<a href="contact.html" data-i18n="nav_contact">Contact</a>
</nav>
<div class="lang-switch" aria-label="Language switcher">
<button type="button" class="lang-btn" data-lang="fr" data-i18n="lang_fr">FR</button>
<button type="button" class="lang-btn" data-lang="en" data-i18n="lang_en">EN</button>
</div>
</header>

<main>
<section class="products">
<h2 data-i18n="all_products">Tous les produits</h2>
<div class="category-filters">
  <button class="cat-btn active" data-cat="">Tous</button>
  <button class="cat-btn" data-cat="foyer">Foyer</button>
  <button class="cat-btn" data-cat="produit">Produit chicha</button>
  <button class="cat-btn" data-cat="accessoire">Accessoire</button>
  <button class="cat-btn" data-cat="chicha">Chicha</button>
</div>
<label class="search-label" for="search" data-i18n="search_label">Rechercher</label>
<input type="search" id="search" data-i18n-placeholder="search_placeholder" placeholder="Nom du produit…" autocomplete="off">
<div id="product-list" class="product-grid"></div>
</section>
</main>

<footer>
<p data-i18n="footer_line">© 2026 Onchiche225 - Boutique de chicha · Livraison dans toute la Cote d'Ivoire</p>
<p class="footer-warning">⚠️ La consommation abusive de chicha est dangereuse pour la santé. À consommer avec modération.</p>
<p style="margin-top:8px;font-size:0.8rem;opacity:0.6;"><a href="legal.html" style="color:inherit;">Mentions légales & CGU</a></p>
</footer>

<script src="products.js"></script>
<script src="script.js"></script>
</body>
</html>
